<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Entrar | TeaSaude</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="./src/css/base.css">
    <link rel="stylesheet" href="./src/css/auth/login.css">
</head>

<body>

    <section class="conteudo login-conteudo">

        <header class="cabecalho-pagina">
            <h1 class="titulo">Entrar no TeaSaude</h1>

            <p class="subtitulo">
                Acesse sua conta para utilizar os serviços do TeaSaude.
            </p>
        </header>

        <form id="formLogin" class="formulario-login" novalidate>

            <div class="campo">
                <label for="nomeUsuario">
                    Nome de usuário
                </label>

                <input
                    type="text"
                    id="nomeUsuario"
                    name="nomeUsuario"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="campo">
                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="acoes-formulario">
                <button
                    type="submit"
                    class="botao-primario"
                    id="botaoEntrar"
                >
                    Entrar
                </button>
            </div>

            <p
                id="mensagemLogin"
                class="mensagem-formulario"
                role="status"
                aria-live="polite"
            >
            </p>

        </form>

        <p class="link-criar-conta">
            Ainda não possui uma conta?
            <a href="./src/pages/auth/criar-conta.html">
                Criar conta
            </a>
        </p>

    </section>
    <script src="./src/js/api.js"></script>
    <script src="./src/js/auth/sessao.js"></script>
    <script src="./src/js/auth/login.js"></script>

</body>

</html>
