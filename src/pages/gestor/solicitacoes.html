<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestor | TeaSaude</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/gestor/solicitacoes.css">
    <link rel="stylesheet" href="../../css/layout.css">
</head>

<body>

    <div class="aplicacao">

        <aside
            id="navegacaoApp"
            class="navegacao-app"
            data-perfil="gestor"
            data-item-ativo="solicitacoes"
        ></aside>

          <main class="pagina">

            <header class="sol-cabecalho">
                <div>
                    <h1 class="sol-titulo">Solicitações e agenda</h1>
                    <p class="sol-instituicao">Clínica Exemplo</p>
                </div>
                <button class="sol-botao-contorno" type="button" disabled title="Indisponível nesta etapa">
                    <i class="bi bi-clock"></i> Disponibilidades
                </button>
            </header>

            <section class="sol-secao" aria-labelledby="titulo-aguardando">
                <h2 id="titulo-aguardando">Aguardando resposta <span class="sol-contador">(1)</span></h2>
                        <section class="sol-secao" aria-labelledby="titulo-aguardando">
            <h2 id="titulo-aguardando">Aguardando resposta <span class="sol-contador">(1)</span></h2>

            <ul class="sol-lista">
                <li class="sol-cartao">
                    <div class="sol-cartao-texto">
                        <p class="sol-cartao-titulo"><strong>Lucas Almeida</strong> · Primeira avaliação em Fonoaudiologia</p>
                        <p class="sol-cartao-detalhe">quarta-feira, 28/10/2026, 08:00–09:00 · Clínica Exemplo · Particular</p>
                    </div>
                    <span class="sol-selo sol-selo-pendente"><i class="bi bi-clock"></i> Pendente</span>
                    <i class="bi bi-chevron-right sol-seta"></i>
                </li>
            </ul>
        </section>
            </section>

            <section class="sol-secao" aria-labelledby="titulo-confirmada">
                <h2 id="titulo-confirmada">Agenda confirmada <span class="sol-contador">(0)</span></h2>
                <div class="sol-vazio">
                    <span class="sol-vazio-icone"><i class="bi bi-calendar"></i></span>
                    <h3>Nenhum atendimento confirmado</h3>
                </div>
            </section>

        </main>

    </div>

    <script src="../../js/layout.js"></script>
    <script src="../../js/gestor/solicitacoes.js"></script>

</body>

</html>
