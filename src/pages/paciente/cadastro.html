<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeaSaude</title>

    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/paciente/cadastro.css">
    <link rel="stylesheet" href="../../css/layout.css">

<body>

    <div class="aplicacao">

        <aside
            id="navegacaoApp"
            class="navegacao-app"
            data-perfil="paciente"
            data-item-ativo="cadastro"
        ></aside>

        <main class="pagina">
            <section class="conteudo">

                <header class="cabecalho-pagina">
                    <h1 class="titulo">Meu cadastro</h1>

                    <p class="subtitulo">
                        Dados do paciente acompanhado por esta conta.
                    </p>
                </header>

                <div class="aviso" role="status">
                    Esta tela ainda não está integrada à API.
                    Os dados informados não serão salvos.
                </div>

                <form
                    id="formPaciente"
                    class="formulario-paciente"
                    novalidate
                >

                    <!-- paciente -->
                    <section class="grupo-formulario">

                        <div class="descricao-grupo">
                            <h2>Paciente</h2>

                            <p>
                                A criança ou o adolescente que será atendido.
                            </p>
                        </div>

                        <div class="campos-grupo">

                            <div class="campo">
                                <label for="nomeCompleto">
                                    Nome completo do paciente
                                    <span class="obrigatorio">*</span>
                                </label>

                                <input
                                    type="text"
                                    id="nomeCompleto"
                                    name="nomeCompleto"
                                    autocomplete="name"
                                    aria-describedby="erroNomeCompleto"
                                    required
                                >

                                <p
                                    id="erroNomeCompleto"
                                    class="mensagem-erro"
                                    aria-live="polite"
                                ></p>
                            </div>

                            <div class="campo">
                                <label for="dataNascimento">
                                    Data de nascimento
                                    <span class="obrigatorio">*</span>
                                </label>

                                <input
                                    type="date"
                                    id="dataNascimento"
                                    name="dataNascimento"
                                    aria-describedby="erroDataNascimento"
                                    required
                                >

                                <p
                                    id="erroDataNascimento"
                                    class="mensagem-erro"
                                    aria-live="polite"
                                ></p>
                            </div>

                        </div>

                    </section>

                    <hr class="divisor-formulario">

                    <!-- responsável -->
                    <section class="grupo-formulario">

                        <div class="descricao-grupo">
                            <h2>Adulto responsável / contato</h2>

                            <p>
                                O adulto que opera esta conta e recebe o contato da instituição.
                            </p>
                        </div>

                        <div class="campos-grupo">

                            <div class="campo">
                                <label for="nomeContato">
                                    Nome do responsável/contato
                                    <span class="obrigatorio">*</span>
                                </label>

                                <input
                                    type="text"
                                    id="nomeContato"
                                    name="nomeContato"
                                    autocomplete="name"
                                    aria-describedby="erroNomeContato"
                                    required
                                >

                                <p
                                    id="erroNomeContato"
                                    class="mensagem-erro"
                                    aria-live="polite"
                                ></p>
                            </div>

                            <div class="linha-campos">

                                <div class="campo">
                                    <label for="telefoneContato">
                                        Telefone de contato
                                        <span class="obrigatorio">*</span>
                                    </label>

                                    <input
                                        type="tel"
                                        id="telefoneContato"
                                        name="telefoneContato"
                                        autocomplete="tel"
                                        placeholder="(81) 99999-9999"
                                        aria-describedby="erroTelefoneContato"
                                        required
                                    >

                                    <p
                                        id="erroTelefoneContato"
                                        class="mensagem-erro"
                                        aria-live="polite"
                                    ></p>
                                </div>

                                <div class="campo">
                                    <label for="emailContato">
                                        E-mail de contato
                                        <span class="opcional">(opcional)</span>
                                    </label>

                                    <input
                                        type="email"
                                        id="emailContato"
                                        name="emailContato"
                                        autocomplete="email"
                                        placeholder="exemplo@email.com"
                                        aria-describedby="erroEmailContato"
                                    >

                                    <p
                                        id="erroEmailContato"
                                        class="mensagem-erro"
                                        aria-live="polite"
                                    ></p>
                                </div>

                            </div>

                        </div>

                    </section>

                    <div class="acoes-formulario">

                        <button
                            type="button"
                            class="botao-secundario"
                            disabled
                            title="A página inicial ainda está em desenvolvimento">
                            Voltar ao início
                        </button>

                        <button
                            type="submit"
                            class="botao-primario">
                            Salvar alterações
                        </button>

                    </div>

                    <p
                        id="mensagemFormulario"
                        class="mensagem-formulario"
                        aria-live="polite"
                    ></p>

                </form>

            </section>
        </main>

    </div>

    <script src="../../js/layout.js"></script>
    <script src="../../js/paciente/cadastro.js"></script>

</body>

</html>
