<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administração | TeaSaude</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/admin/administracao.css">
    <link rel="manifest" href="../../../manifest.webmanifest">
    <meta name="theme-color" content="#117A72">
</head>

<body>

    <p id="avisoSessao" role="status">
    Verificando sessão...
    </p>

    <div class="aplicacao" style="visibility: hidden;">

        <aside
            id="navegacaoApp"
            class="navegacao-app"
            data-perfil="admin"
            data-item-ativo="administracao"
        ></aside>

        <main class="pagina">

            <section class="conteudo">

                <header class="cabecalho-pagina">
                    <h1 class="titulo">
                        Administração
                    </h1>

                    <p class="subtitulo">
                        Área administrativa do TeaSaude.
                    </p>
                </header>

                <section class="pacientes-admin" aria-labelledby="tituloPacientes">

                    <h2 id="tituloPacientes">
                        Pacientes cadastrados
                    </h2>

                    <p id="estadoPacientes" role="status" aria-live="polite">
                        Carregando pacientes...
                    </p>

                    <ul
                        id="listaPacientes"
                        class="lista-pacientes"
                        hidden
                    ></ul>

                </section>

                <section
                    id="painelPaciente"
                    class="painel-paciente"
                    aria-labelledby="tituloDadosPaciente"
                    hidden
                >
                    <h2 id="tituloDadosPaciente">Dados do paciente</h2>

                    <p id="estadoPaciente" role="status" aria-live="polite"></p>

                    <dl id="dadosPaciente" class="dados-paciente" hidden>
                        <div>
                            <dt>Nome completo</dt>
                            <dd id="detalheNome"></dd>
                        </div>

                        <div>
                            <dt>Data de nascimento</dt>
                            <dd id="detalheNascimento"></dd>
                        </div>

                        <div>
                            <dt>Responsável</dt>
                            <dd id="detalheResponsavel"></dd>
                        </div>

                        <div>
                            <dt>Telefone</dt>
                            <dd id="detalheTelefone"></dd>
                        </div>

                        <div>
                            <dt>E-mail de contato</dt>
                            <dd id="detalheEmail"></dd>
                        </div>
                    </dl>

                    <button
                        type="button"
                        id="botaoEditarPaciente"
                        class="botao-consultar"
                        hidden
                    >
                        Editar dados
                    </button>

                    <form id="formEditarPaciente" class="formulario-edicao" novalidate hidden>

                        <h3>Editar dados do paciente</h3>

                        <div class="campo">
                            <label for="editarNomeCompleto">Nome completo</label>
                            <input type="text" id="editarNomeCompleto"
                                minlength="3" required>
                        </div>

                        <div class="campo">
                            <label for="editarDataNascimento">Data de nascimento</label>
                            <input type="date" id="editarDataNascimento" required>
                        </div>

                        <div class="campo">
                            <label for="editarNomeContato">Responsável / contato</label>
                            <input type="text" id="editarNomeContato" required>
                        </div>

                        <div class="campo">
                            <label for="editarTelefoneContato">Telefone</label>
                            <input type="tel" id="editarTelefoneContato" required>
                        </div>

                        <div class="campo">
                            <label for="editarEmailContato">E-mail (opcional)</label>
                            <input type="email" id="editarEmailContato">
                        </div>

                        <p id="mensagemEdicao" role="status" aria-live="polite"></p>

                        <div class="acoes-formulario">
                            <button
                                type="button"
                                id="botaoCancelarEdicao"
                                class="botao-secundario"
                            >
                                Cancelar
                            </button>

                            <button
                                type="submit"
                                id="botaoSalvarPaciente"
                                class="botao-primario"
                            >
                                Salvar alterações
                            </button>
                        </div>

                    </form>
                </section>

            </section>

        </main>

    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/auth/sessao.js"></script>
    <script src="../../js/auth/proteger-pagina.js"></script>
    <script src="../../js/layout.js"></script>
    <script src="../../js/admin/administracao.js"></script>

</body>

</html>
